name: docker

# 在 fork 仓库中构建/发布 NAS 部署用的 Docker 镜像，均直接拉取本仓库已发布的 GitHub Release
# 中的产物打进镜像，不在此重新编译。提供两种镜像：
#   - desktop（docker/Dockerfile）：MXU 桌面 GUI + noVNC，仅支持 linux/amd64
#     （上游 MXU 未发布 linux-aarch64 GUI 二进制）
#   - web（docker/Dockerfile.web）：社区项目 MWU 纯 Web 控制，支持 linux/amd64 + linux/arm64
# 触发方式：
#   1. Release 发布后自动触发（install.yml 产出正式版 Release 时）
#   2. 手动触发（workflow_dispatch），可指定要打包的 Release Tag，留空则使用最新 Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要打包的 Release Tag（留空则使用最新 Release）"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Resolve image metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)
          fi
          owner_lower=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=$tag" | tee -a "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner_lower}/maaend" | tee -a "$GITHUB_OUTPUT"

  build-and-push-desktop:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            MAAEND_REPO=${{ github.repository }}
            MAAEND_VERSION=${{ needs.meta.outputs.tag }}
          tags: |
            ${{ needs.meta.outputs.image }}:latest
            ${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.tag }}

  build-and-push-web:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (for cross-building linux/arm64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            MAAEND_REPO=${{ github.repository }}
            MAAEND_VERSION=${{ needs.meta.outputs.tag }}
          tags: |
            ${{ needs.meta.outputs.image }}:web
            ${{ needs.meta.outputs.image }}:web-${{ needs.meta.outputs.tag }}
